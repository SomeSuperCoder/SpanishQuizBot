[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bot-de-encuestas"
version = "0.1.0"
description = "Telegram bot para crear encuestas en canales de español"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.26.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp-socks>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
bot = "bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"